# ========== 主题 ==========
theme: jekyll-theme-chirpy
theme_mode: light          # light / dark
avatar: /assets/img/avatar/doraemon.jpg

# ========== 构建 ==========
markdown: kramdown
highlighter: rouge
paginate: 10
paginate_path: /page:num/

plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-imagemagick

# jekyll-archives 配置（生成分类/标签聚合页）
jekyll-archives:
  enabled: [categories, tags]
  layout: archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# ========== 集合（_tabs 顶部导航菜单）==========
# 必须显式声明，否则 site.tabs 为空，左侧边栏的菜单不会渲染
collections:
  tabs:
    output: true
    sort_by: order

# ========== 可选开关 ==========
toc: true                  # 文章自动生成目录
# math: true              # 需要公式时打开
# mermaid: true           # 需要流程图时打开
# comments:               # 评论系统（giscus/utterances）按需配置
# analytics:              # 访问统计按需配置
