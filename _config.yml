# ========== 基础信息 ==========
title: 安置屋
tagline: 学习笔记外置站
description: 好记性不如烂笔头，处处记不如时时用
url: "https://bug421-git.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

# ========== 作者 / 社交 ==========
