# 分类树的单一数据源。三级结构：
#   一级（章目录）：parent 为空，children 列出它下面的「章」
#   二级（章内节目录）：parent 指向所属一级 slug，文章按 section_order 排成「第 N 节」
#
# slug        : front matter categories[] 里的英文标识，必须与文章完全一致（含大小写）
# name        : 中文显示名（面包屑、目录页标题、章目录列表）
# url         : 聚合页地址，必须与 jekyll-archives 实际生成的路径一致（slugify 后小写）
# description : 目录页副标题，一句话说明这层收什么内容
# children    : 仅一级分类使用，数组顺序即「第 1 章 / 第 2 章」的顺序
# parent      : 仅二级分类使用，指向一级分类 slug
# flat        : 仅一级分类使用。设为 true 时忽略 children，不渲染章目录，
#               直接把本分类下所有文章按日期升序平铺成一条列表。
#               用于「章下面只有一两节」的分类——分成章反而比平铺更难扫。
#
# 未在此登记的 slug 也能正常工作（层级从文章 front matter 自动推导），
# 登记的作用是：① 提供中文名 ② 固定章节顺序 ③ 提供目录页描述。

# ========== 富交互（三级结构） ==========
- slug: rich-interaction
  name: 富交互
  url: /categories/rich-interaction/
  description: 富交互相关内容笔记：动画与过渡、Web Animations API、观察器、性能与渲染优化等。
  children:
    - interaction-animation
    - performance-rendering

- slug: interaction-animation
  name: 交互与动画
  url: /categories/interaction-animation/
  parent: rich-interaction
  description: animation / transition / @keyframes、WAAPI、观察器三件套（IntersectionObserver / ResizeObserver / MutationObserver）、progress-driven 动画。

- slug: performance-rendering
  name: 性能渲染与优化
  url: /categories/performance-rendering/
  parent: rich-interaction
  description: 渲染性能、重排重绘、合成层、资源加载与关键渲染路径优化。

