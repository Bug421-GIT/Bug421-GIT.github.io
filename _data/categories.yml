# ========== 计算机网络（不设章：平铺成 1~8 的线性目录） ==========
# 1~6 篇直接挂一级；7、8 篇分别落在 Ajax / Cookie 下，各自只有一节。
# 章下面只有一节时，章目录纯属多一层点击，所以这里用 flat 关掉，全部平铺。
# children 保留不删：它仍然决定 /categories/ajax/ 这类页面存在，也方便以后恢复章目录。
- slug: 计算机网络
  name: 计算机网络
  url: /categories/计算机网络/
  description: 分层模型、各层协议，以及浏览器发起网络请求与鉴权的完整链路。
  flat: true
  children:
    - Ajax
    - cookie

- slug: Ajax
  name: Ajax
  url: /categories/ajax/
  parent: 计算机网络
  description: XMLHttpRequest、Fetch 与跨域请求。

- slug: cookie
  name: Cookie
  url: /categories/cookie/
  parent: 计算机网络
  description: Cookie、Session、Storage 与请求鉴权。

